<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 20px;
        }
        .container {
            max-width: 780px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }
        .header .logo {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .header .logo span {
            color: #4f46e5;
        }
        .header .logo i {
            color: #4f46e5;
            margin-right: 6px;
        }
        .header .sub {
            color: #6b7280;
            font-size: 14px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            padding: 28px 32px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .email-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 18px;
        }
        .email-box .addr {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
            color: #1a1a2e;
            word-break: break-all;
            background: transparent;
            border: none;
            outline: none;
        }
        .email-box .addr::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }
        .email-box .actions {
            display: flex;
            gap: 6px;
        }
        .email-box .actions button {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 8px;
            color: #6b7280;
            cursor: pointer;
            transition: .2s;
            font-size: 15px;
        }
        .email-box .actions button:hover {
            background: #e5e7eb;
            color: #1a1a2e;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: #4f46e5;
            color: #fff;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .btn-outline {
            background: transparent;
            color: #6b7280;
            border: 1.5px solid #e5e7eb;
        }
        .btn-outline:hover {
            background: #f8fafc;
        }
        .btn-outline:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .inbox-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .inbox-header .left h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .inbox-header .count {
            background: #e5e7eb;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
        }
        .inbox-header .meta {
            font-size: 12px;
            color: #9ca3af;
        }
        .msg-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-item {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px 18px;
            cursor: pointer;
            transition: .2s;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .msg-item:hover {
            border-color: #4f46e5;
            transform: translateX(2px);
        }
        .msg-item .avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        .msg-item .body {
            flex: 1;
            min-width: 0;
        }
        .msg-item .top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 2px;
        }
        .msg-item .from {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .msg-item .time {
            font-size: 12px;
            color: #9ca3af;
            flex-shrink: 0;
        }
        .msg-item .subj {
            font-size: 13px;
            font-weight: 500;
            color: #4f46e5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .msg-item .preview {
            font-size: 13px;
            color: #6b7280;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .msg-item .otp-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            padding: 2px 10px;
            background: #eef2ff;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #4f46e5;
        }
        .empty {
            text-align: center;
            padding: 50px 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 2px dashed #e5e7eb;
        }
        .empty .icon {
            font-size: 40px;
            color: #d1d5db;
            margin-bottom: 12px;
        }
        .empty h3 {
            font-size: 16px;
            font-weight: 600;
            color: #6b7280;
        }
        .empty p {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* MODAL - PAKE WEBVIEW */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: .25s;
        }
        .modal.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: #fff;
            border-radius: 16px;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: scale(.96);
            transition: .25s;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
        }
        .modal.open .modal-box {
            transform: scale(1);
        }
        .modal-head {
            padding: 18px 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-head h3 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f3f4f6;
            border-radius: 8px;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
        }
        .modal-close:hover {
            background: #e5e7eb;
        }

        /* WEBVIEW UNTUK KONTEN EMAIL */
        .modal-body {
            flex: 1;
            overflow: hidden;
            padding: 0;
            position: relative;
        }
        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .detail-subj {
            font-size: 18px;
            font-weight: 600;
            padding: 20px 24px 0;
        }
        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 24px 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        .detail-meta span {
            font-size: 12px;
            color: #6b7280;
            background: #f3f4f6;
            padding: 4px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-meta span i {
            color: #4f46e5;
        }
        .otp-box {
            background: #eef2ff;
            border-radius: 10px;
            padding: 14px 20px;
            margin: 0 24px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .otp-box .lbl {
            font-size: 11px;
            font-weight: 600;
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .otp-box .code {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 4px;
        }
        .otp-box .copy-otp {
            padding: 6px 16px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        .otp-box .copy-otp:hover {
            background: #4338ca;
        }

        .toast-stack {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .toast {
            padding: 10px 18px;
            background: #1a1a2e;
            color: #fff;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
            animation: slideUp .3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast.ok {
            background: #065f46;
        }
        .toast.err {
            background: #991b1b;
        }
        .toast.inf {
            background: #1e40af;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:600px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 18px 16px;
            }
            .email-box {
                padding: 10px 14px;
                flex-wrap: wrap;
            }
            .email-box .addr {
                font-size: 13px;
                min-width: 120px;
                order: 2;
                flex: 1 1 100%;
            }
            .email-box .icon {
                order: 1;
            }
            .email-box .actions {
                order: 3;
            }
            .btn-row .btn {
                flex: 1;
                justify-content: center;
                padding: 8px 14px;
                font-size: 12px;
            }
            .modal-box {
                max-width: 100%;
                margin: 10px;
            }
            .otp-box .code {
                font-size: 22px;
                letter-spacing: 3px;
            }
            .inbox-header .meta {
                display: none;
            }
            .detail-subj {
                padding: 16px 16px 0;
                font-size: 16px;
            }
            .detail-meta {
                padding: 10px 16px 12px;
            }
            .otp-box {
                margin: 0 16px 12px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo"><i class="fas fa-envelope"></i> Temp<span>Mail</span></div>
            <div class="sub">Disposable Temporary Email</div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-at"></i> Your Temporary Email Address</div>
            <div class="email-box">
                <span class="icon"><i class="fas fa-envelope"></i></span>
                <input class="addr" id="emailDisplay" placeholder="Generate new address" readonly>
                <div class="actions">
                    <button onclick="copyEmail()" id="copyBtn" disabled><i class="fas fa-copy"></i></button>
                    <button onclick="refreshInbox()" id="refBtn" disabled><i class="fas fa-sync" id="refIcon"></i></button>
                    <button onclick="deleteAccount()" id="delBtn" disabled style="color:#dc2626;"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="genBtn" onclick="generateEmail()"><i class="fas fa-plus"></i> Generate</button>
                <button class="btn btn-outline" onclick="refreshInbox()" id="refBtn2" disabled><i class="fas fa-sync"></i> Refresh</button>
            </div>
        </div>

        <div class="card" style="padding:20px 24px;">
            <div class="inbox-header">
                <div class="left"><h2>Inbox</h2><span class="count" id="msgCount">0</span></div>
                <span class="meta" id="lastRef">Waiting...</span>
            </div>
            <div class="msg-list" id="msgList">
                <div class="empty"><div class="icon"><i class="fas fa-inbox"></i></div><h3>Your inbox is empty</h3><p>Waiting for incoming emails</p></div>
            </div>
        </div>
    </div>

    <!-- MODAL DENGAN IFRAME WEBVIEW -->
    <div class="modal" id="modalBg">
        <div class="modal-box">
            <div class="modal-head">
                <h3><i class="fas fa-envelope" style="color:#4f46e5;"></i> Message</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="detail-subj" id="modalSubject">Loading...</div>
            <div class="detail-meta" id="modalMeta"></div>
            <div id="modalOtp"></div>
            <div class="modal-body" id="modalBody">
                <iframe id="emailFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
            </div>
        </div>
    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script>
        const TEMPY_API = 'https://tempy.email/api/v1';
        let account = null,
            messages = [],
            refreshTimer = null,
            isGenerating = false;

        const API = {
            async request(url, options = {}) {
                const res = await fetch(url, { ...options,
                    headers: { 'Accept': 'application/json', ...(options.headers || {}) } });
                let data = null;
                const text = await res.text();
                if (text) { try { data = JSON.parse(text); } catch { data = text; } }
                if (!res.ok) {
                    let msg = 'HTTP ' + res.status;
                    if (data) {
                        if (typeof data === 'string') msg += ': ' + data.slice(0, 150);
                        else if (data.error) msg += ': ' + data.error;
                        else if (data.message) msg += ': ' + data.message;
                    }
                    throw new Error(msg);
                }
                return data;
            },
            createMailbox() { return this.request(TEMPY_API + '/mailbox', { method: 'POST' }); },
            getMessages(email) { return this.request(TEMPY_API + '/mailbox/' + encodeURIComponent(email) + '/messages'); },
            getMailbox(email) { return this.request(TEMPY_API + '/mailbox/' + encodeURIComponent(email)); },
            deleteMailbox(email) { return this.request(TEMPY_API + '/mailbox/' + encodeURIComponent(email), { method: 'DELETE' }); }
        };

        async function generateEmail() {
            if (isGenerating) return;
            if (account) {
                if (!confirm('Buat email baru? Email lama akan dihapus.')) return;
                try { await API.deleteMailbox(account.email); } catch (e) {}
                clearSession(false);
            }
            const btn = document.getElementById('genBtn');
            const orig = btn.innerHTML;
            btn.disabled = true;
            isGenerating = true;
            btn.innerHTML = '<span class="spinner"></span> Creating...';
            try {
                const result = await API.createMailbox();
                if (!result?.email) throw new Error('API tidak mengembalikan email');
                account = { email: result.email, webUrl: result.webUrl || null, expiresAt: result.expiresAt || null,
                    createdAt: Date.now() };
                messages = [];
                localStorage.setItem('neonmail_session', JSON.stringify(account));
                updateUI();
                toast('Generated: ' + account.email, 'ok');
                renderMessages();
                await refreshInbox();
            } catch (e) {
                toast('Generate failed: ' + e.message, 'err');
            } finally {
                btn.disabled = false;
                isGenerating = false;
                btn.innerHTML = orig;
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const saved = localStorage.getItem('neonmail_session');
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                if (data?.email) {
                    account = data;
                    updateUI();
                    toast('Session restored', 'inf');
                    try {
                        await API.getMailbox(account.email);
                        await refreshInbox();
                    } catch (e) {
                        if (/404|expired|deactivated/i.test(e.message)) {
                            toast('Mailbox expired', 'err');
                            clearSession(false);
                        }
                    }
                }
            } catch (e) { localStorage.removeItem('neonmail_session'); }
        });

        function updateUI() {
            const el = document.getElementById('emailDisplay');
            el.value = account.email;
            document.getElementById('copyBtn').disabled = false;
            document.getElementById('refBtn').disabled = false;
            document.getElementById('refBtn2').disabled = false;
            document.getElementById('delBtn').disabled = false;
        }

        async function refreshInbox() {
            if (!account?.email) { toast('No active session', 'err'); return; }
            const icon = document.getElementById('refIcon');
            icon.classList.add('fa-spin');
            try {
                const data = await API.getMessages(account.email);
                messages = Array.isArray(data) ? data : (data?.messages || data?.emails || data?.data || []);
                renderMessages();
                document.getElementById('msgCount').textContent = messages.length;
                document.getElementById('lastRef').textContent = 'Updated: ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit',
                    minute: '2-digit' });
                if (messages.length) toast(messages.length + ' message' + (messages.length > 1 ? 's' : '') + ' received', 'inf');
            } catch (e) {
                if (/404|expired|deactivated/i.test(e.message)) {
                    toast('Mailbox expired', 'err');
                    clearSession(false);
                } else {
                    toast('Refresh failed: ' + e.message, 'err');
                }
            } finally {
                icon.classList.remove('fa-spin');
            }
        }

        function renderMessages() {
            const container = document.getElementById('msgList');
            document.getElementById('msgCount').textContent = messages.length || 0;
            if (!messages?.length) {
                container.innerHTML =
                    `<div class="empty"><div class="icon"><i class="fas fa-inbox"></i></div><h3>Your inbox is empty</h3><p>Waiting for incoming emails</p></div>`;
                return;
            }
            container.innerHTML = messages.map((msg, i) => {
                const from = cleanFromName(getFrom(msg));
                const subj = getSubject(msg);
                const body = getBody(msg);
                const otp = extractOTP(subj + ' ' + body);
                const time = formatDate(getDate(msg));
                return `<div class="msg-item" onclick="openMessage(${i})">
                    <div class="avatar">${esc(from.charAt(0) || '?').toUpperCase()}</div>
                    <div class="body">
                        <div class="top"><span class="from">${esc(from)}</span><span class="time">${esc(time)}</span></div>
                        <div class="subj">${esc(subj)}</div>
                        <div class="preview">${esc(body.slice(0, 160))}</div>
                        ${otp ? `<div class="otp-badge"><i class="fas fa-shield-halved"></i> OTP: ${esc(otp)}</div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function getFrom(m) { return m?.from || m?.sender || 'Unknown'; }

        function getSubject(m) { return String(m?.subject || m?.title || 'No Subject'); }

        function getBody(m) { return String(m?.body_text || m?.bodyText || m?.text || m?.body || m?.content || m?.preview ||
                ''); }

        function getDate(m) { return m?.received_at || m?.receivedAt || m?.created_at || m?.createdAt || m?.date || ''; }

        function cleanFromName(f) {
            if (!f) return 'Unknown';
            const m = String(f).match(/^"?([^"<]+)"?\s*(?:<.*>)?$/);
            return m ? m[1].trim() || f : String(f).replace(/<[^>]+>/g, '').trim() || String(f);
        }

        function formatDate(d) {
            if (!d) return 'Unknown';
            const dt = new Date(d);
            return isNaN(dt.getTime()) ? String(d) : dt.toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit',
                minute: '2-digit' });
        }

        function formatLongDate(d) {
            if (!d) return 'Unknown';
            const dt = new Date(d);
            return isNaN(dt.getTime()) ? String(d) : dt.toLocaleString('id-ID', { weekday: 'long', day: 'numeric',
                month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function extractOTP(text) {
            if (!text) return null;
            const m = text.match(/\b\d{4,8}\b/);
            return m ? m[0] : null;
        }

        /* =========================================================
           OPEN MESSAGE - PAKE WEBVIEW (IFRAME)
           ========================================================= */
        function openMessage(index) {
            const msg = messages[index];
            if (!msg) { toast('Message not found', 'err'); return; }

            const from = cleanFromName(getFrom(msg));
            const subj = getSubject(msg);
            const body = getBody(msg);
            const html = msg?.body_html || msg?.bodyHtml || msg?.html || null;
            const otp = extractOTP(subj + ' ' + body);

            // Set subject & meta
            document.getElementById('modalSubject').textContent = subj;

            document.getElementById('modalMeta').innerHTML = `
                <span><i class="fas fa-user"></i> ${esc(from)}</span>
                <span><i class="fas fa-clock"></i> ${esc(formatLongDate(getDate(msg)))}</span>
                <span><i class="fas fa-tag"></i> ${esc(account.email)}</span>
            `;

            // Set OTP
            if (otp) {
                document.getElementById('modalOtp').innerHTML = `
                    <div class="otp-box">
                        <div>
                            <div class="lbl">Detected OTP</div>
                            <div class="code">${esc(otp)}</div>
                        </div>
                        <button class="copy-otp" onclick="copyOTP('${escJs(otp)}')"><i class="fas fa-copy"></i> Copy</button>
                    </div>
                `;
            } else {
                document.getElementById('modalOtp').innerHTML = '';
            }

            // BUILD HTML UNTUK IFRAME
            let emailHtml = '';
            
            if (html) {
                // Kalo ada HTML dari API, pake itu
                emailHtml = stripDanger(html);
            } else {
                // Kalo plain text, ubah ke HTML
                let text = body || 'No content';
                // Escape dulu
                let escaped = esc(text);
                // Newline ke <br>
                escaped = escaped.replace(/\n/g, '<br>');
                // Detect URL bebas
                escaped = escaped.replace(/(https?:\/\/[^\s<>"']+)/gi, function(url) {
                    return `<a href="${url}" target="_blank" rel="noopener" style="color:#4f46e5;text-decoration:underline;">${url}</a>`;
                });
                // Detect teks + URL: "Sign in to Alight Creative https://..."
                escaped = escaped.replace(/([^<]*?)(https?:\/\/[^\s<>"']+)/gi, function(match, textBefore, url) {
                    if (match.includes('<a href')) return match;
                    let label = textBefore.trim();
                    label = label.replace(/[:\-–—]+$/, '').trim();
                    if (!label || label.length < 2) {
                        return `<a href="${url}" target="_blank" rel="noopener" style="color:#4f46e5;text-decoration:underline;">${url}</a>`;
                    }
                    return `<a href="${url}" target="_blank" rel="noopener" style="color:#4f46e5;text-decoration:underline;">${label}</a>`;
                });
                // Bersihin URL yang kelewat
                escaped = escaped.replace(/(https?:\/\/[^\s<>"']+)/gi, function(url) {
                    if (url.includes('<a href')) return url;
                    return `<a href="${url}" target="_blank" rel="noopener" style="color:#4f46e5;text-decoration:underline;">${url}</a>`;
                });
                emailHtml = escaped;
            }

            // BUILD FULL HTML UNTUK IFRAME
            const fullHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>
                        body {
                            font-family: -apple-system, 'Inter', sans-serif;
                            font-size: 14px;
                            line-height: 1.8;
                            color: #1a1a2e;
                            padding: 20px 24px;
                            margin: 0;
                            background: #fff;
                        }
                        a {
                            color: #4f46e5 !important;
                            text-decoration: underline !important;
                            font-weight: 500;
                        }
                        a:hover {
                            color: #4338ca !important;
                        }
                        p { margin-bottom: 10px; }
                        .link-wrap {
                            display: flex;
                            align-items: center;
                            gap: 12px;
                            margin: 10px 0;
                            padding: 10px 16px;
                            background: #f8fafc;
                            border: 1px solid #e5e7eb;
                            border-radius: 8px;
                            flex-wrap: wrap;
                        }
                        .link-wrap:hover {
                            border-color: #4f46e5;
                            background: #f0f2ff;
                        }
                        .link-wrap .link-text { flex: 1; min-width: 60px; word-break: break-all; }
                        .link-wrap .actions { display: flex; gap: 6px; }
                        .link-wrap .actions button {
                            padding: 4px 12px;
                            border: 1px solid #e5e7eb;
                            background: #fff;
                            border-radius: 6px;
                            font-size: 11px;
                            cursor: pointer;
                            color: #6b7280;
                        }
                        .link-wrap .actions button:hover {
                            background: #4f46e5;
                            color: #fff;
                            border-color: #4f46e5;
                        }
                        .email-btn {
                            display: inline-block;
                            padding: 10px 24px;
                            background: #4f46e5;
                            color: #fff !important;
                            text-decoration: none !important;
                            border-radius: 8px;
                            font-weight: 600;
                            margin: 8px 0;
                        }
                        .email-btn:hover {
                            background: #4338ca !important;
                        }
                        @media (max-width: 600px) {
                            body { padding: 16px; }
                            .link-wrap { flex-direction: column; align-items: stretch; }
                            .link-wrap .actions { justify-content: center; }
                        }
                    </style>
                </head>
                <body>
                    ${emailHtml}
                </body>
                </html>
            `;

            // Render ke iframe
            const iframe = document.getElementById('emailFrame');
            const blob = new Blob([fullHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            iframe.src = url;

            // Buka modal
            document.getElementById('modalBg').classList.add('open');
            
            // Cleanup object URL setelah iframe load
            iframe.onload = function() {
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
        }

        async function copyEmail() {
            if (!account) return;
            try { await navigator.clipboard.writeText(account.email);
                toast('✅ Email copied!', 'ok'); } catch (e) { toast('Copy failed', 'err'); }
        }

        async function copyOTP(otp) {
            try { await navigator.clipboard.writeText(otp);
                toast('✅ OTP copied!', 'ok'); } catch (e) { toast('Copy failed', 'err'); }
        }

        async function deleteAccount() {
            if (!account) return;
            if (!confirm('Hapus email ini? Semua data akan hilang.')) return;
            const btn = document.getElementById('delBtn');
            btn.disabled = true;
            try { await API.deleteMailbox(account.email); } catch (e) {}
            clearSession(true);
            toast('Address terminated', 'ok');
        }

        function clearSession(showToast = false) {
            account = null;
            messages = [];
            if (refreshTimer) { clearInterval(refreshTimer);
                refreshTimer = null; }
            localStorage.removeItem('neonmail_session');
            document.getElementById('emailDisplay').value = 'Generate new address';
            document.getElementById('copyBtn').disabled = true;
            document.getElementById('refBtn').disabled = true;
            document.getElementById('refBtn2').disabled = true;
            document.getElementById('delBtn').disabled = true;
            document.getElementById('msgCount').textContent = '0';
            document.getElementById('lastRef').textContent = 'Waiting...';
            renderMessages();
            if (showToast) toast('Session cleared', 'ok');
        }

        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(() => { if (account && !document.hidden) refreshInbox(); }, 12000);
        }
        startAutoRefresh();

        function closeModal() {
            document.getElementById('modalBg').classList.remove('open');
            // Hentikan iframe
            const iframe = document.getElementById('emailFrame');
            iframe.src = 'about:blank';
        }
        document.getElementById('modalBg').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
            if (e.ctrlKey && e.key === 'r') { e.preventDefault(); if (account) refreshInbox(); }
        });

        function esc(text) {
            if (text == null) return '';
            const d = document.createElement('div');
            d.textContent = String(text);
            return d.innerHTML;
        }

        function escJs(text) { return String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r/g, '\\r')
            .replace(/\n/g, '\\n'); }

        function stripDanger(html) {
            return String(html)
                .replace(/<script[\s\S]*?<\/script>/gi, '')
                .replace(/<style[\s\S]*?<\/style>/gi, '')
                .replace(/<iframe[\s\S]*?<\/iframe>/gi, '')
                .replace(/<object[\s\S]*?<\/object>/gi, '')
                .replace(/<embed[\s\S]*?<\/embed>/gi, '')
                .replace(/<form[\s\S]*?<\/form>/gi, '')
                .replace(/on\w+="[^"]*"/gi, '')
                .replace(/on\w+='[^']*'/gi, '');
        }

        function toast(message, type = 'inf') {
            const stack = document.getElementById('toastStack');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            const icons = { ok: 'fa-check-circle', err: 'fa-times-circle', inf: 'fa-info-circle' };
            el.innerHTML = '<i class="fas ' + (icons[type] || icons.inf) + '"></i> ' + message;
            stack.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-10px)';
                setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
            }, 3500);
        }
    </script>

</body>
</html>
